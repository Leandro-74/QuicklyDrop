name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: >
          ./gradlew
          :protocol:test
          :core:testDebugUnitTest
          :app:testDebugUnitTest
          --console=plain

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QUICKLYDROP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quicklydrop-release.jks"

      - name: Build signed APK
        env:
          QUICKLYDROP_KEYSTORE: ${{ runner.temp }}/quicklydrop-release.jks
          QUICKLYDROP_KEYSTORE_PASSWORD: ${{ secrets.QUICKLYDROP_KEYSTORE_PASSWORD }}
          QUICKLYDROP_KEY_ALIAS: ${{ secrets.QUICKLYDROP_KEY_ALIAS }}
          QUICKLYDROP_KEY_PASSWORD: ${{ secrets.QUICKLYDROP_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "QuicklyDrop-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "QuicklyDrop-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: QuicklyDrop-${{ github.ref_name }}.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            QuicklyDrop ${{ github.ref_name }}.

            This build may not have been validated on physical devices. NFC discovery,
            Wi-Fi Direct and MediaStore are implemented against the measured lab
            protocol, but real-device behavior may still fail. Please report issues
            with device model, Android version and logcat output.

            Requirements: Android 10+ with NFC and Wi-Fi Direct. Keep the app open
            while sending; the receiver uses a foreground service.
