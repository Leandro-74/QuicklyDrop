name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: >
          ./gradlew
          :protocol:test
          :core:testDebugUnitTest
          :lab:testDebugUnitTest
          :diag:testDebugUnitTest
          :lab:assembleDebug
          :diag:assembleDebug
          --console=plain

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            protocol/build/test-results/test
            core/build/test-results/testDebugUnitTest
            lab/build/test-results/testDebugUnitTest
            diag/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
